port: 7890
socks-port: 7891
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '0.0.0.0:9090'

proxies:
  - name: CHANGE_ME
    type: trojan
    server: example.com
    port: 443
    password: change-me

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - CHANGE_ME
      - DIRECT

rules:
  - DOMAIN-SUFFIX,openrouter.ai,PROXY
  - DOMAIN-SUFFIX,api.telegram.org,PROXY
  - MATCH,DIRECT